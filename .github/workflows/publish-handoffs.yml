name: Publish DWN handoffs

on:
  push:
    paths:
      - "handoff/inbox/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwn-handoff-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Process handoff queue
        run: python3 publisher/process_handoff.py

      - name: Commit published content
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles processed-trends.json processed-press-releases.json processed-affiliate-emails.json handoff
          git commit -m "Publish DWN handoff"
          git pull --rebase origin main
          git push origin HEAD:main
