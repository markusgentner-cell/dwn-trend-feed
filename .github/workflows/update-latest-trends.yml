name: Update latest Google Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 5-12 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scraper/fetch_trends.js"
      - ".github/workflows/update-latest-trends.yml"

permissions:
  contents: write

concurrency:
  group: update-latest-trends
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.56.1

      - name: Fetch Google Trends
        run: node scraper/fetch_trends.js

      - name: Commit latest.json
        run: |
          if git diff --quiet -- latest.json; then
            echo "latest.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Refresh latest Google Trends"
          git pull --rebase origin main
          git push
