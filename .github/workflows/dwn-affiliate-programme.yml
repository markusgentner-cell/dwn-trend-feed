name: DWN Affiliate-Programme

on:
  workflow_dispatch:
  # Activate schedule after Gmail OAuth and article generation are deployed:
  # schedule:
  #   - cron: "*/30 4-17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dwn-affiliate-collection
  cancel-in-progress: false

jobs:
  affiliate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Berlin business hours
        id: window
        shell: bash
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          minute=$(TZ=Europe/Berlin date +%M)
          day=$(TZ=Europe/Berlin date +%u)
          if [ "$day" -le 5 ] && [ "$hour" -ge 6 ] && [ "$hour" -le 18 ] && { [ "$hour" -ne 18 ] || [ "$minute" -eq 0 ]; }; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check connector prerequisites
        if: steps.window.outputs.due == 'true'
        env:
          GMAIL_CLIENT_ID: ${{ secrets.DWN_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.DWN_GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.DWN_GMAIL_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          missing=0
          for key in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN OPENAI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Affiliate collection not operational: configure credentials and production Gmail processing before activation."
            exit 1
          fi
          echo "OAuth prerequisites present."
      - name: Generate affiliate handoffs
        if: steps.window.outputs.due == 'true'
        env:
          DWN_GMAIL_CLIENT_ID: ${{ secrets.DWN_GMAIL_CLIENT_ID }}
          DWN_GMAIL_CLIENT_SECRET: ${{ secrets.DWN_GMAIL_CLIENT_SECRET }}
          DWN_GMAIL_REFRESH_TOKEN: ${{ secrets.DWN_GMAIL_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
        run: python3 automation/affiliate.py --scheduled

      - name: Commit handoffs and update requests
        if: steps.window.outputs.due == 'true'
        shell: bash
        run: |
          git add handoff/inbox affiliate-update-requests.json
          if git diff --cached --quiet; then
            echo "No affiliate handoffs or update requests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Queue DWN affiliate handoffs"
          git pull --rebase origin main
          git push origin HEAD:main
