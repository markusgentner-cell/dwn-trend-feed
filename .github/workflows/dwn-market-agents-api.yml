name: DWN Market Agents API

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwn-editorial-writes
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)

      - name: Generate due market articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 automation/agents.py
          else
            python3 automation/agents.py --scheduled
          fi

      - name: Commit new agent articles
        run: |
          git add articles/agenten
          if git diff --cached --quiet; then
            echo "No editorial changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish DWN market agent articles"
          git pull --rebase origin main
          git push
