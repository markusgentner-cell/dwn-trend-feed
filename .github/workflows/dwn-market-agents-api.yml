name: DWN Market Agents API

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwn-editorial-writes
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)

      - name: Generate due market articles
        id: generate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 automation/agents.py 2>&1 | tee /tmp/dwn-agent-output.log
          else
            python3 automation/agents.py --scheduled 2>&1 | tee /tmp/dwn-agent-output.log
          fi
          exit "${PIPESTATUS[0]}"

      - name: Record API fallback status
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          log = Path("/tmp/dwn-agent-output.log")
          content = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          path = Path("handoff/api-status.json")
          if "credit_balance_exhausted" in content or "insufficient_quota" in content or "You have no credits remaining" in content:
              state = "quota_exhausted"
          elif "Agent summary:" in content and "failed=0" in content:
              state = "available"
          else:
              state = "unchanged"
          if state != "unchanged":
              previous = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
              if previous.get("state") != state:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(json.dumps({"state": state, "checked_at": datetime.now(timezone.utc).isoformat(), "source": "dwn-market-agents-api"}, indent=2) + "\n", encoding="utf-8")
                  print("API status updated:", state)
              else:
                  print("API status unchanged:", state)
          else:
              print("No definitive quota status from this run")
          PY

      - name: Commit new agent articles
        shell: bash
        run: |
          git add articles/agenten
          if [ -f handoff/api-status.json ]; then git add handoff/api-status.json; fi
          if git diff --cached --quiet; then
            echo "No new agent article files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish DWN market agent articles"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published agent articles
        shell: bash
        run: |
          git fetch origin main
          if [ -f /tmp/dwn-agent-output.log ]; then
            grep '^CREATED: articles/agenten/' /tmp/dwn-agent-output.log | sed 's/^CREATED: //' > /tmp/dwn-created-paths.txt || true
          else
            : > /tmp/dwn-created-paths.txt
          fi
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if git cat-file -e "origin/main:$path"; then
              echo "VERIFIED on main: $path"
            else
              echo "::error::Missing generated article on main: $path"
              exit 1
            fi
          done < /tmp/dwn-created-paths.txt
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            echo "::error::Article generation failed. Inspect generation log; already generated files were committed if present."
            exit 1
          fi
          echo "Article generation and remote verification complete."
