name: DWN Market Agents API

on:
  schedule:
    - cron: "0,15 6,7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwn-editorial-writes
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)

      - name: Generate due market articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
        run: python3 automation/agents.py --scheduled

      - name: Commit new agent articles
        run: |
          if git diff --quiet; then
            echo "No editorial changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agenten
          git commit -m "Publish DWN market agent articles"
          git pull --rebase origin main
          git push
